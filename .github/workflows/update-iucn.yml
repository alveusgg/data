name: Update IUCN

on:
  workflow_dispatch:
  schedule:
    # Run every Tuesday at midnight, giving time to merge before org-wide
    #  Dependabot PRs are generated on Wednesday at midnight
    - cron: "0 0 * * 2"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Authenticate GitHub Package Registry
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm ci

      - name: Update IUCN data
        run: pnpm iucn
        env:
          IUCN_API_TOKEN: ${{ secrets.IUCN_API_TOKEN }}

      - name: Bump version
        id: version
        run: |
          # Check if there are any changes
          if git diff --exit-code; then
            echo "No changes to commit."
            exit 0
          fi

          # Bump the version
          pnpm version minor --no-git-checks --no-git-tag-version

          # Output the new version
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Create PR
        if: steps.version.outputs.version != ''
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GH_PR_TOKEN }}
          sign-commits: true
          title: Update IUCN species data
          body: Generated via `pnpm iucn`
          commit-message: Update IUCN species data
          branch: automated/iucn
